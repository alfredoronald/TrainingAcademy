<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Training Academy</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="icon-wrapper">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
                    </svg>
                </div>
                <span class="badge">Alumno</span>
            </div>
            
            <h1>Iniciar Sesión</h1>
            <p class="subtitle">Accede a tu cuenta de Training Academy como alumno</p>
            
            <form class="login-form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <!-- <button type="submit" class="btn btn-login">Iniciar Sesión</button>-->
                <a href="../catalogo/catalogo.html" class="btn btn-login">Iniciar Sesión</a>
            </form>
            
            <a href="#" class="back-link">Volver</a>
        </div>
    </div>
</body>
</html>
