<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Tipo de Cuenta</title>
    <link rel="stylesheet" href="sesion.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                <path d="M6 12v5c0 1 2 3 6 3s6-2 6-3v-5"/>
            </svg>
        </div>
        
        <h1>¿Cómo deseas iniciar sesión?</h1>
        <p class="subtitle">Selecciona el tipo de cuenta</p>
        
        <div class="cards-container">
            <!-- Card Alumno -->
            <div class="card">
                <div class="icon-circle icon-blue">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
                    </svg>
                </div>
                <h2>Soy Alumno</h2>
                <p class="description">Quiero aprender y tomar cursos</p>
                <!--<button class="btn btn-alumno">Continuar como Alumno</button>-->
                <a href="../login/login.html" class="btn btn-alumno"> Continuar como alumno</a>

            </div>
            
            <!-- Card Maestro -->
            <div class="card">
                <div class="icon-circle icon-green">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        <path d="M12 6v8M9 9h6"/>
                    </svg>
                </div>
                <h2>Soy Maestro</h2>
                <p class="description">Quiero enseñar y crear cursos</p>
                <button class="btn btn-maestro">Continuar como Maestro</button>
            </div>
        </div>
        
        <a href="#" class="back-link">Volver</a>
    </div>
</body>
</html>
